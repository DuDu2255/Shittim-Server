name: Build and Release Shittim Server

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:

          - name: windows-x64
            os: windows-latest
            runtime: win-x64
            archive: Shittim-Server-windows-x64

          - name: linux-x64
            os: ubuntu-latest
            runtime: linux-x64
            archive: Shittim-Server-linux-x64

          - name: linux-arm64
            os: ubuntu-latest
            runtime: linux-arm64
            archive: Shittim-Server-linux-arm64


    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json


      - name: Run tests
        if: matrix.runtime == 'win-x64'
        run: |
          dotnet test ./Shittim-Server.Tests/Shittim-Server.Tests.csproj -c Release --nologo


      - name: Resolve version
        id: version
        shell: pwsh
        run: |

          $props = Get-Content ./Directory.Build.props -Raw

          if ($props -notmatch '<Version>([^<]+)</Version>') {
              throw "No Version found"
          }

          $version = $Matches[1]

          $package = (Get-Content ./ShittimControlCenter/package.json -Raw | ConvertFrom-Json).version


          if ($package -ne $version) {
              throw "Version mismatch"
          }


          $tag="v$version"


          if(git tag --list $tag){
              throw "$tag already exists"
          }


          "tag=$tag" >> $env:GITHUB_OUTPUT



      - name: Publish server runtime
        run: |

          dotnet publish ./Shittim-Server/Shittim-Server.csproj `
          -c Release `
          -r ${{ matrix.runtime }} `
          --self-contained true `
          -o ./server-runtime



      - name: Package release
        shell: pwsh
        run: |

          $folder="${{ matrix.archive }}"
          
          if(Test-Path $folder){
             Remove-Item $folder -Recurse -Force
          }


          mkdir $folder


          Copy-Item ./server-runtime "$folder/server-runtime" -Recurse


          if(Test-Path README.md){
             Copy-Item README.md "$folder/README.md"
          }


          if(Test-Path Scripts){
             Copy-Item Scripts "$folder/Scripts" -Recurse
          }


          Compress-Archive `
          -Path "$folder/*" `
          -DestinationPath "${folder}-${{ steps.version.outputs.tag }}.zip"



      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:

          name: ${{ matrix.archive }}

          path: |
            ${{ matrix.archive }}-${{ steps.version.outputs.tag }}.zip




  release:

    needs: build

    runs-on: ubuntu-latest


    steps:


      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0



      - name: Resolve version
        id: version
        shell: bash
        run: |

          VERSION=$(grep -oP '(?<=<Version>).*?(?=</Version>)' Directory.Build.props)

          echo "tag=v$VERSION" >> $GITHUB_OUTPUT



      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release



      - name: Create tag
        run: |

          git config user.name github-actions[bot]

          git config user.email 41898282+github-actions[bot]@users.noreply.github.com


          git tag "${{ steps.version.outputs.tag }}"

          git push origin "${{ steps.version.outputs.tag }}"



      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:

          tag_name: ${{ steps.version.outputs.tag }}

          name: ${{ steps.version.outputs.tag }}

          files: |

            release/**/*.zip

          generate_release_notes: truename: Build and Release Shittim Server

